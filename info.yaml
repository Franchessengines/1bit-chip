project:
  title: "Tiny1 - 1-bit CPU with XNOR neuron"
  author: "Fran"
  discord: ""
  description: "1-bit host-driven CPU: bit-serial add/sub, all 16 logic functions, XNOR neuron counter, LFSR."
  language: "Verilog"
  clock_hz: 10000000

  tiles: "1x1"

  top_module: "tt_um_tiny1_cpu"

  source_files:
    - "project.v"

pinout:
  ui[0]: "Operand bit 0"
  ui[1]: "Operand bit 1"
  ui[2]: "Operand bit 2"
  ui[3]: "Operand bit 3 (operand 15 = host bit)"
  ui[4]: "Opcode bit 0"
  ui[5]: "Opcode bit 1"
  ui[6]: "Opcode bit 2"
  ui[7]: "Opcode bit 3"

  uo[0]: "CNT bit 0 (neuron / popcount counter)"
  uo[1]: "CNT bit 1"
  uo[2]: "CNT bit 2"
  uo[3]: "CNT bit 3"
  uo[4]: "CNT bit 4"
  uo[5]: "CNT bit 5"
  uo[6]: "CNT bit 6"
  uo[7]: "CNT bit 7"

  uio[0]: "HX host data bit (input)"
  uio[1]: "GO execute strobe (input)"
  uio[2]: "RR result bit (output)"
  uio[3]: "CY carry (output)"
  uio[4]: "DO bit stored to host (output)"
  uio[5]: "WR one-clock write pulse (output)"
  uio[6]: "GE counter >= threshold (output)"
  uio[7]: ""

yaml_version: 6
